# One-click deploy: https://render.com/deploy?repo=<this repo's URL>
#
# Render reads this file and creates the service already configured. The only
# thing asked at create time is the Atlas connection string (where the pilots
# are kept). AUTH_SECRET is generated by Render, never pasted.
services:
  - type: web
    name: skyfight
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Israel -> Frankfurt is ~60ms; a dogfight feels every millisecond
    region: frankfurt
    # Free sleeps after 15 minutes idle and takes ~50s to wake (the page says
    # so while it waits). Fine for friends; upgrade if it gets busy.
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DB_DRIVER
        value: mongo
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB
        value: skyfight
